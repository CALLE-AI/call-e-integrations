openapi: 3.1.0
info:
  title: CALL-E Core API — hand-authored testing subset
  version: 0.1.0
  description: Prepared on 2026-10-13 from public CALL-E documentation. Not an official
    OpenAPI export. Requests use a conservative test profile; response objects intentionally
    permit additional fields. Installing this file does not create a connector or
    authorize any call.
servers:
- url: https://api.heycall-e.com
  description: Fixed production API for this customer-facing Skill; no environment selection required.
security:
- CalleApiKey: []
paths:
  /v1/goals:
    get:
      operationId: listPublishedGoals
      summary: List visible published Goals without calling anyone
      parameters:
      - name: limit
        in: query
        required: false
        description: Page size.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: after
        in: query
        required: false
        description: Opaque previous next_cursor.
        schema:
          type: string
      responses:
        '200':
          description: Successful read, including an empty data array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalList'
        '400': &id001
          description: Invalid request; inspect structured error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401': &id002
          description: API key missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403': &id003
          description: Operation not permitted for this key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default: &id004
          description: Other HTTP error; inspect status and structured details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/goals/{goal_id}:
    get:
      operationId: getPublishedGoal
      summary: Read one published Goal interface
      parameters:
      - name: goal_id
        in: path
        required: true
        description: Actual visible Goal id; not a RunSpec id.
        schema:
          type: string
      responses:
        '200':
          description: Published interface.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400': *id001
        '401': *id002
        '403': *id003
        default: *id004
  /v2/calls:
    post:
      operationId: createOneCall
      summary: Create one immediate call after explicit user authorization
      description: May dial a real number and incur costs. Save the original request
        and one stable key before sending. This Skill uses Calls v2, not legacy v1
        calls.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Stable logical-call key; reuse unchanged request/key after uncertain
          submission.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCall'
      responses:
        '202':
          description: Durably accepted; not proof of connection or business success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '409':
          description: Idempotency conflict; inspect details.reason_code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Definitive input rejection when identified by the documented
            error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400': *id001
        '401': *id002
        '403': *id003
        default: *id004
  /v2/calls/{call_id}:
    get:
      operationId: getCall
      summary: Read an existing Call without redialing
      parameters:
      - &id005
        name: call_id
        in: path
        required: true
        description: API resource id from Call.id; NOT the nullable Billing call_id.
        schema:
          type: string
      responses:
        '200':
          description: Current persisted Call state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '400': *id001
        '401': *id002
        '403': *id003
        default: *id004
  /v2/calls/{call_id}/events:
    get:
      operationId: getCallEvents
      summary: Read persisted event pages, not SSE
      parameters:
      - *id005
      - name: limit
        in: query
        required: false
        description: Page size.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        required: false
        description: Same-call pagination cursor; retain the last event id for subsequent
          polling.
        schema:
          type: string
      responses:
        '200':
          description: Persisted event page; preserve cursor and deduplicate by event
            id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400': *id001
        '401': *id002
        '403': *id003
        default: *id004
  /v2/calls/{call_id}/cancel:
    post:
      operationId: cancelCallBeforeSubmission
      summary: Attempt cancellation before provider submission
      description: Requires user authorization for this resource. Does not guarantee
        hangup of an active telephone call.
      parameters:
      - *id005
      responses:
        '200':
          description: Stored Call state after cancellation processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '409':
          description: Cancellation cannot be performed at this stage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400': *id001
        '401': *id002
        '403': *id003
        default: *id004
components:
  securitySchemes:
    CalleApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'Complete header value: Bearer <CALLE_API_KEY>. This is a project
        API key, NOT an OAuth access token. Configure only in the host secret store;
        avoid double Bearer prefixes.'
  schemas:
    CreateCall:
      type: object
      additionalProperties: false
      required:
      - task
      - phone
      - result_schema
      properties:
        task:
          type: string
          minLength: 1
          description: Complete task facts and intended spoken language.
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          description: One user-authorized E.164 number. Syntax validation is not
            coverage validation.
        region:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{2}$
          description: Optional destination hint; keep omitted values omitted on retry.
        locale:
          type:
          - string
          - 'null'
          description: Optional actual spoken language. Support must be verified for
            the destination.
        result_schema:
          $ref: '#/components/schemas/ClosedScalarResultSchema'
        metadata:
          type: object
          additionalProperties: true
          description: Application correlation data; avoid secrets and unnecessary
            private data.
        webhook_url:
          type:
          - string
          - 'null'
          format: uri
          pattern: ^https://
          description: Optional user-approved HTTPS receiver. Omit for initial tests.
    ClosedScalarResultSchema:
      type: object
      description: Conservative schema-writing profile used by this Skill, not the
        full server-side JSON Schema meta-schema. Use closed objects and at most 32
        scalar properties.
      required:
      - type
      - additionalProperties
      - properties
      properties:
        type:
          const: object
        additionalProperties:
          const: false
        properties:
          type: object
          maxProperties: 32
          additionalProperties:
            $ref: '#/components/schemas/ScalarProperty'
        required:
          type: array
          uniqueItems: true
          items:
            type: string
        description:
          type: string
      additionalProperties: false
    ScalarProperty:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - string
          - boolean
          - integer
          - number
        description:
          type: string
        enum:
          type: array
          items:
            type:
            - string
            - boolean
            - integer
            - number
      additionalProperties: false
    Call:
      type: object
      additionalProperties: true
      description: Known response fields only. Extra server fields are permitted;
        no fabricated mandatory fields.
      properties:
        id:
          type: string
          description: API resource id used in read/events/cancel paths.
        object:
          type: string
        call_id:
          type:
          - string
          - 'null'
          description: Billing correlation id; never substitute for resource id.
        duration:
          type:
          - number
          - 'null'
          minimum: 0
          description: Recorded BillSec duration in seconds. Preserves zero and fractional values; null while unavailable, independently of result_status. Optional for older service versions.
        status:
          type: string
          description: Execution lifecycle state, not business success.
        call_outcome:
          type:
          - string
          - 'null'
        result_status:
          type: string
          enum:
          - pending
          - available
          - unavailable
          - not_applicable
        result:
          type:
          - object
          - 'null'
          additionalProperties: true
        error:
          type:
          - object
          - 'null'
          additionalProperties: true
        transcript:
          type: array
          items:
            type: object
            additionalProperties: true
    Goal:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        object:
          type: string
        title:
          type:
          - string
          - 'null'
        published_run_spec:
          type: object
          additionalProperties: true
    GoalList:
      type: object
      additionalProperties: true
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Goal'
        next_cursor:
          type:
          - string
          - 'null'
    EventPage:
      type: object
      additionalProperties: true
      description: Known persisted JSON event-page fields; additional fields remain
        permitted.
      properties:
        object:
          type: string
        data:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
              type:
                type: string
              details:
                type: object
                additionalProperties: true
        next_cursor:
          type:
          - string
          - 'null'
    ErrorEnvelope:
      type: object
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
externalDocs:
  description: Official CALL-E documentation
  url: https://docs.heycall-e.com/quickstart
