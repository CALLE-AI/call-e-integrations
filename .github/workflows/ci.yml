name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run checks
        run: pnpm check

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Test Python OAuth example
        run: uv run --isolated --project examples/mcp-oauth-client/python pytest examples/mcp-oauth-client/python

      - name: Validate package contents
        run: pnpm pack:dry-run

  windows-cli:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test CLI and documented Windows commands
        run: pnpm --filter @call-e/cli test

      - name: Check integration versions
        run: pnpm check:versions
